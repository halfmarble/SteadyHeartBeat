name: steady_heart_beat
description: SteadyHeartBeat — continuous heart rate monitoring via AirPods Pro 3 with voice readout.
publish_to: 'none'
version: 1.0.0+320

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  fl_chart: ^0.69.0
  path_provider: ^2.1.3
  wakelock_plus: ^1.2.3
  url_launcher: ^6.3.0
  # Presents the system share sheet so the user can export (a copy of) their own
  # data off-device by explicit choice. Local-only: it invokes the OS share UI
  # (UIActivityViewController); it has no network access of its own.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  # Used in tests to install a no-op wakelock so error/start paths don't hit
  # the unmocked platform channel.
  wakelock_plus_platform_interface: ^1.5.1
  # Used in tests to point path_provider at a temp dir (with the platform-
  # interface mixin it needs) so the file-backed stores can be exercised.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
